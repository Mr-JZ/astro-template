server_tokens off;

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  # The TLS-terminating proxy sits in front, so absolute redirects would point visitors at http://.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

  # Matches the original request, so nginx's own internal index.html lookup cannot loop.
  if ($request_uri ~ ^([^?]*/)index\.html(\?.*)?$) {
    return 301 $1$2;
  }

  # Astro fingerprints everything in /_astro/, so these files never change under the same name.
  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri/ =404;
  }
}
